name: Build and deploy MaiChat

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Refresh the public stable APK even when the website source has not changed.
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out website
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Test release integrity and rendering
        run: python3 -m unittest discover -s tests -v
      - name: Resolve official stable release
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/build.py --metadata-only
          --metadata-output "$RUNNER_TEMP/maichat-release.json"
          --github-output "$GITHUB_OUTPUT"
      - name: Cache verified APK by SHA-256
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .cache/releases
          key: maichat-official-apk-${{ steps.release.outputs.sha256 }}
      - name: Build static site and verify APK
        run: python3 scripts/build.py --release-json "$RUNNER_TEMP/maichat-release.json"
      - name: Check assembled Material markup and tokens
        run: python3 scripts/check_material.py --site-root _site _site
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload complete site with versioned APK
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
