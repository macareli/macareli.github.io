<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="MaiChat — a universal AI roleplay harness, built with Flutter.">
    <link rel="canonical" href="https://maichat.me/">
    <title>MaiChat</title>
    <style>
      :root { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color-scheme: light dark; }
      * { box-sizing: border-box; }
      body { margin: 0; background: Canvas; color: CanvasText; }
      main { display: flex; flex-direction: column; justify-content: center; min-height: 100svh; max-width: 56rem; margin: auto; padding: 4rem clamp(1.5rem, 6vw, 4rem); }
      .eyebrow { font-size: .8rem; font-weight: 600; letter-spacing: .15em; }
      h1 { margin: 1.25rem 0; font-size: clamp(3.5rem, 12vw, 7rem); line-height: 1.05; letter-spacing: -.06em; }
      .intro { max-width: 32rem; margin: 0; font-size: clamp(1.15rem, 3vw, 1.45rem); line-height: 1.6; }
      nav { display: flex; flex-wrap: wrap; gap: .75rem; margin: 2.5rem 0 4rem; }
      a { color: inherit; text-underline-offset: .2em; }
      nav a { display: inline-block; padding: .85rem 1.15rem; border: 1px solid currentColor; border-radius: .5rem; text-decoration: none; font-weight: 600; }
      nav a:first-child { color: Canvas; background: CanvasText; }
      a:focus-visible { outline: 3px solid #547fff; outline-offset: 5px; }
      footer { font-size: .95rem; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">MAICHAT.ME</p>
      <h1>MaiChat</h1>
      <p class="intro">A universal AI roleplay harness, built with Flutter.</p>
      <nav aria-label="MaiChat links">
        <a href="https://github.com/macareli/Maichat">View project</a>
        <a href="https://github.com/macareli/Maichat/releases">Releases &amp; downloads</a>
      </nav>
      <footer><a href="https://github.com/macareli">macareli on GitHub</a></footer>
    </main>
  </body>
</html>
